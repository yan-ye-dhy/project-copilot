[project]
name = "project-copilot"
version = "0.1.0"
description = "研发知识与工单协作智能体"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.138.0,<0.139.0",
    "httpx>=0.28.1,<0.29.0",
    "jieba>=0.42.1,<0.43",
    "langchain-text-splitters>=1.1.2,<1.2.0",
    "openai>=2.48.0,<3.0.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.14.2,<3.0.0",
    "pypdfium2>=5.12.1,<6.0.0",
    "python-multipart>=0.0.32,<0.1.0",
    "qdrant-client>=1.19.1,<1.20.0",
    "rank-bm25>=0.2.2,<0.3",
    "sqlalchemy>=2.0.22,<2.1",
    "starlette>=1.7.0,<2.0.0",
    "uvicorn>=0.49.0,<0.50.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<9.0"]
rerank = ["torch==2.14.1", "transformers==5.20.2"]
rerank-gpu = ["torch==2.14.1", "transformers==5.20.2"]

[tool.uv]
conflicts = [[{ group = "rerank" }, { group = "rerank-gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "rerank" },
    { index = "pytorch-cu130", group = "rerank-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
