[project]
name = "project-copilot"
version = "0.1.0"
description = "研发知识与工单协作智能体"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.0,<0.139.0",
    "httpx>=0.28.1,<0.29.0",
    "langchain-text-splitters>=1.1.2,<1.2.0",
    "openai>=2.48.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "pypdfium2>=5.12.1,<6.0.0",
    "python-multipart>=0.0.32,<0.1.0",
    "qdrant-client>=1.19.1,<1.20.0",
    "starlette>=1.7.0,<2.0.0",
    "uvicorn>=0.49.0,<0.50.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<9.0"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
