# Image selection only. All isolation, dependencies and CLOSED health gates
# are inherited from docker-compose.public-demo.yml.
services:
  api:
    image: project-copilot-api:personal-demo
  worker:
    image: project-copilot-api:personal-demo
    # Finish a 900s graph and drain an already-started 300s tool on SIGTERM.
    # A hard stop still preserves uncertainty; it never authorizes a replay.
    stop_grace_period: 1260s
  migrate:
    image: project-copilot-api:personal-demo
