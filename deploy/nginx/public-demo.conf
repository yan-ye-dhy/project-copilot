# A single local ingress, not a cloud WAF. Constant keys deliberately ignore
# untrusted X-Forwarded-For / Cloudflare headers. Zones are shared by workers.
worker_processes 2;
pid /tmp/nginx.pid;
# Nginx raw error context can contain the full query string. Keep it out of
# persisted Docker logs. Diagnose via sanitized JSON/status, health and backend
# run_id; temporary raw logging requires an explicit private maintenance window.
error_log /dev/null crit;
events { worker_connections 256; }
http {
    access_log off; # Never log cookies, tokens, query strings or request bodies.
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 20s;
    keepalive_timeout 10s;
    keepalive_requests 100;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_max_body_size 4259840; # 4 MiB file plus 64 KiB multipart overhead.
    client_body_buffer_size 64k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    merge_slashes off;

    map "$request_method:$uri" $allowed_route {
        default 0;
        ~^GET:/(health|ui/config|auth/me|tickets|documents)$ 1;
        ~^POST:/auth/(register|login|logout)$ 1;
        ~^POST:/(agent/contexts|actions/preview|jobs|jobs/upload)$ 1;
        "~^GET:/(tickets|actions|jobs)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" 1;
        "~^GET:/jobs/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/events$" 1;
        "~^DELETE:/documents/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" 1;
        "~^POST:/actions/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(confirm|reject)$" 1;
    }
    map $request_uri $bad_raw_path {
        default 0;
        ~^[^?]*% 1;
        ~^[^?]*\\\\ 1;
        ~^[^?]*// 1;
    }
    map $http_x_project_copilot_proxy_secret $proxy_header_present {
        default 0;
        "~^[A-Za-z0-9_-]{32,128}$" 1;
    }
    map $request_method $write_key { default ""; POST public; DELETE public; }
    map $request_method $global_key { default public; }
    limit_req_zone $global_key zone=all_requests:1m rate=30r/s;
    limit_req_zone $write_key zone=write_requests:1m rate=2r/s;
    limit_conn_zone $global_key zone=all_connections:1m;
    limit_conn_zone $write_key zone=write_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8080;
        if ($proxy_header_present = 0) { return 403; }
        if ($allowed_route = 0) { return 404; }
        if ($bad_raw_path = 1) { return 400; }
        error_page 400 414 431 = @bad_request;
        error_page 413 = @too_large;
        error_page 404 = @not_found;
        error_page 403 = @forbidden;
        error_page 429 = @limited;
        error_page 500 502 503 504 = @unavailable;
        location @bad_request {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 400 '{"detail":"请求格式或大小无效。"}';
        }
        location @too_large {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 413 '{"detail":"请求内容过大。"}';
        }
        location @not_found {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 404 '{"detail":"请求地址不存在。"}';
        }
        location @forbidden {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 403 '{"detail":"访问被拒绝。"}';
        }
        location @limited {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header Retry-After 2 always;
            return 429 '{"detail":"请求过于频繁，请稍后重试。"}';
        }
        location @unavailable {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 503 '{"detail":"服务暂时不可用，请查询操作状态。"}';
        }
        location / {
            limit_req zone=all_requests burst=40 nodelay;
            limit_req zone=write_requests burst=8 nodelay;
            limit_conn all_connections 24;
            limit_conn write_connections 4;
            proxy_http_version 1.1;
            # Docker DNS refresh keeps an independently rebuilt API reachable.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api http://api:8002;
            proxy_pass $api;
            proxy_pass_request_headers off;
            proxy_set_header Host api;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding identity;
            proxy_set_header Accept $http_accept;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Copilot-Context-Id $http_x_copilot_context_id;
            proxy_set_header X-Copilot-Context-Token $http_x_copilot_context_token;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header Last-Event-ID $http_last_event_id;
            # Never generate a shared secret here; backend checks the supplied
            # value, which only the server-side Cloud Function should possess.
            proxy_set_header X-Project-Copilot-Proxy-Secret $http_x_project_copilot_proxy_secret;
            proxy_connect_timeout 3s;
            proxy_send_timeout 20s;
            proxy_read_timeout 110s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off; # Never replay a write on upstream failure.
            proxy_intercept_errors on;
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-Accel-Redirect;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
