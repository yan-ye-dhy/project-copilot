# CLOSED by default. Preparation never enables release authorization, Worker
# or tunnel. The ingress health probe preserves the backend release gate.
# Separate project name/volumes: never attach the existing production data.
name: project-copilot-public-demo

x-app: &app
  labels:
    io.project-copilot.scope: public-demo-v2
  image: ${PROJECT_COPILOT_PUBLIC_API_IMAGE:-project-copilot-api:public-demo}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      RERANK_GROUP: rerank
  user: "${PROJECT_COPILOT_CONTAINER_UID:-1000}:${PROJECT_COPILOT_CONTAINER_GID:-1000}"
  env_file:
    - ${PROJECT_COPILOT_PUBLIC_ENV_FILE:-.env.public-demo}
  environment:
    PROJECT_COPILOT_ENVIRONMENT: production
    PROJECT_COPILOT_PUBLIC_DEMO: "true"
    PROJECT_COPILOT_PUBLIC_PROXY_SECRET: ${PROJECT_COPILOT_PUBLIC_PROXY_SECRET:?public proxy secret required}
    PROJECT_COPILOT_AUTH_PUBLIC_ORIGIN: ${PROJECT_COPILOT_AUTH_PUBLIC_ORIGIN:?public origin required}
    PROJECT_COPILOT_DATABASE_URL: ${PROJECT_COPILOT_DATABASE_URL:?public demo database URL required}
    PROJECT_COPILOT_QDRANT_URL: http://qdrant:6333
    PROJECT_COPILOT_MANIFEST_DIR: /app/data/manifests
    PROJECT_COPILOT_FINAL_MODEL_CACHE_DIR: /app/models/huggingface
    PROJECT_COPILOT_FINAL_RERANK_DEVICE: cpu
    PROJECT_COPILOT_FINAL_RERANK_DTYPE: float32
    PROJECT_COPILOT_UPLOAD_MAX_BYTES: "4194304"
    PROJECT_COPILOT_PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
  volumes:
    - manifests:/app/data/manifests
    - type: bind
      source: ${PROJECT_COPILOT_MODEL_CACHE_HOST_DIR:-./models/huggingface}
      target: /app/models/huggingface
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PROJECT_COPILOT_RELEASE_EVIDENCE_HOST_DIR:-./data/release-evidence}
      target: /app/release
      read_only: true
      bind:
        create_host_path: false
  networks: [backend, egress]
  read_only: true
  tmpfs: ["/tmp:size=512m"]

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: project_copilot_public
      POSTGRES_PASSWORD: ${PROJECT_COPILOT_PUBLIC_POSTGRES_PASSWORD:?public demo postgres password required}
      POSTGRES_DB: project_copilot_public
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_copilot_public -d project_copilot_public"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes: ["qdrant_data:/qdrant/storage"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; read -r reply <&3; [[ \"$$reply\" == *'200 OK'* ]]"]
      interval: 3s
      timeout: 3s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix@sha256:d55a4ffac8c670e2d0bf72e44e81e32a73e832b7ce449e6e4567487adfa9d8d6
    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_PORT: 6006
      PHOENIX_ENABLE_AUTH: "false"
    volumes: ["phoenix_data:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  migrate:
    <<: *app
    command: ["python", "-m", "scripts.ticket_db", "upgrade"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # This probe deliberately fails while the public hard gate returns 503.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8002/health', headers={'X-Project-Copilot-Proxy-Secret':os.environ['PROJECT_COPILOT_PUBLIC_PROXY_SECRET']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 120s

  worker:
    <<: *app
    command: ["python", "-m", "scripts.ai_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Do not start queued jobs while the public gateway hard gate causes
      # the API readiness probe to fail. This is a startup dependency only:
      # Compose does not stop an already running worker if health later fails.
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 360s

  ingress:
    labels:
      io.project-copilot.scope: public-demo-v2
    image: project-copilot-ingress:default-domain
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=64m,uid=101,gid=101,mode=700"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.50"
    networks: [backend, ingress]
    environment:
      # Used only by the readiness probe; never injected into proxy requests.
      PROJECT_COPILOT_PUBLIC_PROXY_SECRET: ${PROJECT_COPILOT_PUBLIC_PROXY_SECRET:?public proxy secret required}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null --header="X-Project-Copilot-Proxy-Secret: $$PROJECT_COPILOT_PUBLIC_PROXY_SECRET" http://127.0.0.1:8080/health'
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # Never start without explicit user authorization and completed safety checks.
  cloudflared:
    # Official 2026.10.3 multi-platform manifest, verified against Docker Hub.
    # Version and digest updates require review before any public release.
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://ingress:8080"]
    networks: [ingress]
    depends_on:
      ingress:
        condition: service_healthy

volumes:
  postgres_data:
    name: pc-public-v2-postgres
    external: true
  qdrant_data:
    name: pc-public-v2-qdrant
    external: true
  phoenix_data:
    name: pc-public-v2-phoenix
    external: true
  manifests:
    name: pc-public-v2-manifests
    external: true

networks:
  backend:
    name: pc-public-v2-backend
    external: true
  egress:
    name: pc-public-v2-egress
    external: true
  ingress:
    name: pc-public-v2-ingress
    external: true
